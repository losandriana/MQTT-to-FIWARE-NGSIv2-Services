global:
  scrape_interval: 15s  # How often to scrape the metrics

scrape_configs:
  - job_name: 'orion'
	static_configs:
  	- targets: ['localhost:1026']  # This is the Orion container name and port
	metrics_path: '/metrics'	# This path should be exposed by Orion or your custom exporter
	scheme: 'http'

  - job_name: 'prometheus'
	static_configs:
  	- targets: ['prometheus:9090']  # Prometheus monitoring itself

  # Add more scrape configurations for other exporters or services (if needed)

  - job_name: 'orion_exporter'
	static_configs:
  	- targets: ['localhost:9100']
 	 
remote_write:
  - url: "http://influxdb:8086/api/v2/write?org=<organisation_name>&bucket=<bucket_name>"
	headers:
  	Authorization: "Token <*****>"
